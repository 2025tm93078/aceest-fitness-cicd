apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-a
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aceest-a
  template:
    metadata:
      labels:
        app: aceest-a
    spec:
      containers:
        - name: aceest
          image: rohitvardhanbattula/aceest-fitness:v1.0
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-a-svc
spec:
  selector:
    app: aceest-a
  ports:
    - port: 80
      targetPort: 5000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-b
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aceest-b
  template:
    metadata:
      labels:
        app: aceest-b
    spec:
      containers:
        - name: aceest
          image: rohitvardhanbattula/aceest-fitness:v2.0
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-b-svc
spec:
  selector:
    app: aceest-b
  ports:
    - port: 80
      targetPort: 5000
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-ab-conf
data:
  default.conf: |
    map $http_x_group $backend {
      default aceest-a-svc.default.svc.cluster.local;
      "B"     aceest-b-svc.default.svc.cluster.local;
    }
    server {
      listen 80;
      resolver kube-dns.kube-system.svc.cluster.local valid=10s;
      location / {
        proxy_pass http://$backend;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-ab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-ab
  template:
    metadata:
      labels:
        app: nginx-ab
    spec:
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/conf.d
      volumes:
        - name: conf
          configMap:
            name: nginx-ab-conf
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-ab-entry
spec:
  type: NodePort
  selector:
    app: nginx-ab
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30005

