apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-blue
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aceest-bg
      slot: blue
  template:
    metadata:
      labels:
        app: aceest-bg
        slot: blue
    spec:
      containers:
        - name: aceest
          image: rohitvardhanbattula/aceest-fitness:v1.0
          ports:
            - containerPort: 5000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-green
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aceest-bg
      slot: green
  template:
    metadata:
      labels:
        app: aceest-bg
        slot: green
    spec:
      containers:
        - name: aceest
          image: rohitvardhanbattula/aceest-fitness:v2.0
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-bg-svc
spec:
  type: NodePort
  selector:
    app: aceest-bg
    slot: blue
  ports:
    - port: 80
      targetPort: 5000
      nodePort: 30002
