apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-prod
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aceest-prod
  template:
    metadata:
      labels:
        app: aceest-prod
    spec:
      containers:
        - name: aceest
          image: rohitvardhanbattula/aceest-fitness:v1.0
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-prod-svc
spec:
  selector:
    app: aceest-prod
  ports:
    - port: 80
      targetPort: 5000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-shadow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aceest-shadow
  template:
    metadata:
      labels:
        app: aceest-shadow
    spec:
      containers:
        - name: aceest
          image: rohitvardhanbattula/aceest-fitness:v2.0
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-shadow-svc
spec:
  selector:
    app: aceest-shadow
  ports:
    - port: 80
      targetPort: 5000
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-shadow-conf
data:
  default.conf: |
    upstream prod { server aceest-prod-svc:80; }
    upstream shadow { server aceest-shadow-svc:80; }
    server {
      listen 80;
      location / {
        mirror /mirror;
        mirror_request_body on;
        proxy_pass http://prod;
      }
      location = /mirror {
        internal;
        proxy_pass http://shadow$request_uri;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-shadow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-shadow
  template:
    metadata:
      labels:
        app: nginx-shadow
    spec:
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/conf.d
      volumes:
        - name: conf
          configMap:
            name: nginx-shadow-conf
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-shadow-entry
spec:
  type: NodePort
  selector:
    app: nginx-shadow
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30004
